[package]
name = "sonos-desk-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
input-check = []
network-check = []

[dependencies]
tamer = "=0.1.0"
serde = { version = "1", features = ["derive"] }
toml = "=0.8.23"

[[bin]]
name = "input-check"
path = "src/main.rs"
required-features = ["input-check"]
test = false
bench = false

[[bin]]
name = "network-check"
path = "src/network_main.rs"
required-features = ["network-check"]
test = false
bench = false

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
esp-idf-svc = "=0.53.0"

[build-dependencies]
embuild = { version = "=0.33.5", features = ["espidf"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
