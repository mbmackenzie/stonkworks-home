[package]
name = "sonos-desk-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
input-check = []
network-check = []
controller = ["frame-check"]
display-check = ["dep:ssd1677", "dep:embedded-hal"]
frame-check = ["display-check"]

[dependencies]
tamer = "=0.1.0"
serde = { version = "1", features = ["derive"] }
toml = "=0.8.23"
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["serde"] }
time = { version = "0.3.55", features = ["parsing"] }
ssd1677 = { version = "=0.1.0", default-features = false, optional = true }
embedded-hal = { version = "=1.0.0", optional = true }

[[bin]]
name = "input-check"
path = "src/main.rs"
required-features = ["input-check"]
test = false
bench = false

[[bin]]
name = "network-check"
path = "src/network_main.rs"
required-features = ["network-check"]
test = false
bench = false

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
esp-idf-svc = "=0.53.0"

[[bin]]
name = "controller"
path = "src/control_main.rs"
required-features = ["controller"]
test = false
bench = false

[[bin]]
name = "display-check"
path = "src/display_main.rs"
required-features = ["display-check"]
test = false
bench = false

[[bin]]
name = "frame-check"
path = "src/frame_main.rs"
required-features = ["frame-check"]
test = false
bench = false

[build-dependencies]
embuild = { version = "=0.33.5", features = ["espidf"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
